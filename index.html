<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relájate en la UPB — Mapa interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS — paleta tomada directamente de la ilustración física
     coral  #D74560  |  cian   #91E3F9  |  vino  #4A1330
     gris vía #A0A0A0 | tinta  #17141A  | fondo blanco #FFFFFF
     ============================================================ */
  :root{
    --coral:#D74560;
    --coral-deep:#B93650;
    --cian:#91E3F9;
    --cian-deep:#5FC9E6;
    --vino:#4A1330;
    --vino-soft:#7A3B57;
    --gris:#A0A0A0;
    --tinta:#17141A;
    --bg:#FFFEFC;
    --card:#FFFFFF;
    --line:#EDE7E2;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-pill:999px;
    --font-ui:'Nunito',system-ui,-apple-system,Segoe UI,sans-serif;
    --font-display:'Fredoka',var(--font-ui);
    --shadow-soft:0 2px 10px rgba(74,19,48,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--vino);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;}
  .visually-hidden{
    position:absolute;width:1px;height:1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;
  }

  /* ============================== LAYOUT SHELL ============================== */
  .page{
    max-width:1400px;
    margin:0 auto;
    padding:22px 22px 32px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:100vh;
  }

  /* ============================== HEADER ============================== */
  .top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:6px; min-width:240px;}
  .brand h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(28px,4vw,42px);
    letter-spacing:0.2px;
    margin:0;
    color:var(--vino);
    position:relative;
    display:inline-block;
    width:fit-content;
  }
  .brand h1 .accent{color:var(--coral);}
  .brand h1 svg.scribble{
    position:absolute;
    left:2%;
    bottom:-12px;
    width:96%;
    height:14px;
    overflow:visible;
  }
  .brand p{
    margin:6px 0 0;
    font-size:14.5px;
    color:var(--vino-soft);
    max-width:46ch;
    line-height:1.45;
  }

  /* controles secundarios: menor jerarquía → discretos, agrupados */
  .secondary-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-content:flex-start;
    padding-top:6px;
  }
  .ctrl-btn{
    display:inline-flex;
    align-items:center;
    gap:7px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--vino);
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.15px;
    padding:9px 14px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
    white-space:nowrap;
  }
  .ctrl-btn svg{width:16px;height:16px;flex:none;}
  .ctrl-btn:hover{border-color:var(--cian-deep); transform:translateY(-1px);}
  .ctrl-btn:active{transform:translateY(0);}
  .ctrl-btn.is-active{
    background:var(--vino);
    border-color:var(--vino);
    color:#fff;
    box-shadow:var(--shadow-soft);
  }
  .ctrl-btn.is-active svg{color:var(--cian);}
  .ctrl-btn:focus-visible{outline:2px solid var(--coral); outline-offset:2px;}

  /* ============================== FILTROS ============================== */
  .filters-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .filters-label{
    font-size:11.5px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--gris);
    padding-left:2px;
  }
  .filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 8px;
    scrollbar-width:thin;
  }
  .filters::-webkit-scrollbar{height:6px;}
  .filters::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
  .chip{
    display:inline-flex;
    align-items:center;
    gap:7px;
    flex:none;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--vino);
    font-weight:700;
    font-size:13px;
    padding:9px 15px 9px 12px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip svg{width:17px;height:17px;flex:none; color:var(--vino-soft); transition:color .15s ease;}
  .chip:hover{border-color:var(--coral);}
  .chip.is-on{
    background:var(--coral);
    border-color:var(--coral);
    color:#fff;
  }
  .chip.is-on svg{color:#fff;}
  .chip:focus-visible{outline:2px solid var(--coral); outline-offset:2px;}

  /* ============================== MAPA ============================== */
  .map-section{
    position:relative;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .map-frame{
    position:relative;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-lg);
    padding:clamp(8px,1.6vw,20px);
    box-shadow:var(--shadow-soft);
  }
  .map-scroller{
    position:relative;
    width:100%;
    overflow:hidden;
    border-radius:calc(var(--radius-lg) - 8px);
    background:
      radial-gradient(circle at 18% 22%, rgba(145,227,249,0.16), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(215,69,96,0.10), transparent 45%),
      #FFFFFF;
  }
  .map-world{
    position:relative;
    width:100%;
    line-height:0;
    transform-origin:0 0;
    touch-action:none;
    cursor:grab;
  }
  .map-world.is-panning{cursor:grabbing;}
  .map-world img{
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  /* La ilustración anterior se conserva embebida como respaldo; el plano
     actualizado es el que se muestra y sobre el que se colocan los puntos. */
  #mapImg{ display:none; }

  /* capa svg de proximidad (líneas / círculos "qué hay cerca") */
  .proximity-layer{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .proximity-layer line{
    stroke:var(--vino-soft);
    stroke-width:2.4;
    stroke-dasharray:1 9;
    stroke-linecap:round;
    opacity:0;
    transition:opacity .35s ease;
  }
  .proximity-layer line.show{opacity:.85;}
  .proximity-layer circle.ring{
    fill:none;
    stroke:var(--cian-deep);
    stroke-width:2;
    opacity:0;
    transition:opacity .4s ease, r .4s ease;
  }
  .proximity-layer circle.ring.show{opacity:.55;}

  /* pines de espacios */
  .pin{
    position:absolute;
    transform:translate(-50%,-50%);
    width:30px;height:30px;
    border-radius:50%;
    background:var(--cian);
    border:2.5px solid var(--vino);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-weight:700;
    font-size:13px;
    color:var(--vino);
    cursor:pointer;
    pointer-events:auto;
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease, background .2s ease, opacity .25s ease;
    box-shadow:0 1px 3px rgba(74,19,48,.25);
    z-index:8;
  }
  .pin:hover, .pin:focus-visible{
    transform:translate(-50%,-50%) scale(1.18) translateY(-2px);
    box-shadow:0 0 0 6px rgba(215,69,96,0.18), 0 3px 8px rgba(74,19,48,.3);
    outline:none;
  }
  .pin.is-dimmed{ opacity:.32; }
  .pin.is-match{
    background:var(--coral);
    color:#fff;
    border-color:var(--vino);
  }
  .pin.is-selected{
    animation:pinPulse 1.1s ease-in-out infinite;
  }
  @keyframes pinPulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(215,69,96,.45), 0 3px 8px rgba(74,19,48,.3);}
    50%{ box-shadow:0 0 0 10px rgba(215,69,96,0), 0 3px 8px rgba(74,19,48,.3);}
  }

  /* Marcadores de actividad: letra legible y color de alto contraste. */
  .activity-pin{
    position:absolute;
    transform:translate(-50%,-50%);
    width:28px;height:28px;
    background:var(--vino);
    color:#fff;
    border:2.5px solid #fff;
    outline:2px solid var(--coral);
    border-radius:50%;
    cursor:pointer;
    pointer-events:auto;
    transition:transform .2s ease, opacity .25s ease;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:16px; font-weight:700;
    line-height:1; text-transform:lowercase; z-index:9;
  }
  .activity-pin::after{
    content:'';
    position:absolute; inset:0;
    border-radius:6px;
    animation:actGlow 1.6s ease-in-out infinite;
  }
  @keyframes actGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(215,69,96,.5);}
    50%{ box-shadow:0 0 0 7px rgba(215,69,96,0);}
  }
  .activity-pin:hover, .activity-pin:focus-visible{ transform:translate(-50%,-50%) scale(1.18); outline-color:var(--cian-deep); }
  .activity-pin.is-dimmed{ opacity:.28; }
  .activity-pin.is-match{ border-color:var(--cian); }

  /* tooltip minimal (solo nombre — la ficha completa vendrá después) */
  .pin-tooltip{
    position:absolute;
    background:#fff;
    color:var(--vino);
    border:1.5px solid var(--coral);
    padding:7px 12px;
    border-radius:10px;
    font-size:12.5px;
    font-weight:700;
    line-height:1.32;
    white-space:normal;
    max-width:240px;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s ease, transform .15s ease;
    z-index:30;
    box-shadow:var(--shadow-soft);
  }
  .pin-tooltip b{ display:block; font-family:var(--font-display); font-weight:700; }
  .pin-tooltip .tooltip-tags{
    margin-top:2px;
    font-size:11px;
    font-weight:700;
    color:var(--vino-soft);
    white-space:normal;
  }
  .pin-tooltip::after{ display:none; }
  .pin-tooltip.tooltip-right{ transform:translate(18px,-50%); }
  .pin-tooltip.tooltip-left{ transform:translate(calc(-100% - 18px),-50%); }
  .pin-tooltip.tooltip-top{ transform:translate(-50%,calc(-100% - 18px)); }
  .pin-tooltip.tooltip-bottom{ transform:translate(-50%,18px); }
  .pin-tooltip.show{ opacity:1; }

  /* La información se muestra fuera de la ilustración: nunca cubre los
     números ni los botones de letras. */
  .map-caption{
    min-height:58px;
    margin:12px 4px 0;
  }
  .map-caption .pin-tooltip{
    position:static;
    display:none;
    width:fit-content;
    max-width:min(100%, 420px);
    transform:none;
    opacity:1;
    color:var(--vino);
    background:#fff;
    border:1.5px solid var(--coral);
    box-shadow:var(--shadow-soft);
    pointer-events:auto;
  }
  .map-caption .pin-tooltip .tooltip-tags{ color:var(--vino-soft); }
  .map-caption .pin-tooltip::after{ display:none; }
  .map-caption .pin-tooltip.show{ display:block; transform:none; }

  /* estoy aquí */
  .you-are-here{
    position:absolute;
    transform:translate(-50%,-50%);
    width:16px;height:16px;
    border-radius:50%;
    background:var(--coral);
    border:3px solid #fff;
    box-shadow:0 0 0 3px var(--coral);
    display:none;
    z-index:15;
  }
  .you-are-here.show{ display:block; animation:youPulse 1.8s ease-out infinite; }
  @keyframes youPulse{
    0%{ box-shadow:0 0 0 3px var(--coral), 0 0 0 3px rgba(215,69,96,.5); }
    100%{ box-shadow:0 0 0 3px var(--coral), 0 0 0 22px rgba(215,69,96,0); }
  }

  .distance-label{
    position:absolute;
    transform:translate(-50%,-50%);
    background:#fff;
    border:1.5px solid var(--cian-deep);
    color:var(--vino);
    font-size:10.5px;
    font-weight:800;
    padding:2px 7px;
    border-radius:var(--radius-pill);
    pointer-events:none;
    opacity:0;
    transition:opacity .35s ease;
    z-index:16;
    white-space:nowrap;
  }
  .distance-label.show{ opacity:1; }

  /* descubrir: bocadillo flotante */
  .discover-bubble{
    position:absolute;
    max-width:220px;
    background:#fff;
    border:1.5px solid var(--coral);
    color:var(--vino);
    padding:12px 14px;
    border-radius:14px;
    font-size:12.5px;
    line-height:1.4;
    box-shadow:var(--shadow-soft);
    opacity:0;
    transform:translate(-50%,calc(-100% - 20px)) scale(.94);
    transition:opacity .25s ease, transform .25s ease;
    pointer-events:none;
    z-index:21;
  }
  .discover-bubble b{ display:block; font-family:var(--font-display); font-size:13px; margin-bottom:3px;}
  .discover-bubble.show{ opacity:1; transform:translate(-50%,calc(-100% - 26px)) scale(1); }

  /* controles de zoom, esquina del mapa */
  .zoom-controls{
    position:absolute;
    right:16px; bottom:16px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:18;
  }
  .zoom-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--vino);
    font-size:17px;
    font-weight:800;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:var(--shadow-soft);
  }
  .zoom-btn:hover{ border-color:var(--coral); }

  .map-hint{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:8px 4px 0;
    font-size:11.5px;
    color:var(--gris);
  }
  .map-hint .calib{
    cursor:default;
  }

  /* estados vacíos de proximidad */
  .hint-toast{
    position:absolute;
    left:50%; top:14px;
    transform:translateX(-50%);
    background:var(--vino);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    padding:8px 16px;
    border-radius:var(--radius-pill);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:25;
  }
  .hint-toast.show{ opacity:1; transform:translateX(-50%) translateY(4px); }

  /* ============================== ACTIVIDADES (tarjetas a-e) ============================== */
  .activities-section{ display:flex; flex-direction:column; gap:14px; padding-top:6px; }
  .activities-title{
    font-family:var(--font-display); font-weight:700; font-size:24px;
    color:var(--coral); margin:0;
  }
  .activities-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:14px;
  }
  .activity-card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:var(--radius-md);
    padding:16px 18px;
    box-shadow:var(--shadow-soft);
    cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .activity-card:hover, .activity-card:focus-visible{
    transform:translateY(-2px);
    border-color:var(--coral);
    outline:none;
  }
  .activity-card.is-on{
    border-color:var(--coral);
    background:linear-gradient(180deg, rgba(215,69,96,0.06), transparent 60%);
  }
  .activity-card-head{
    display:flex; align-items:center; gap:10px; margin-bottom:8px;
  }
  .activity-card-badge{
    flex:none; width:28px; height:28px; border-radius:50%;
    background:var(--coral); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:14px;
  }
  .activity-card-name{
    font-family:var(--font-display); font-weight:700; font-size:15.5px;
    color:var(--vino); margin:0;
  }
  .activity-card ul{
    margin:0; padding-left:18px;
    font-size:13px; color:var(--vino-soft); line-height:1.55;
  }

  @media (max-width:720px){
    .page{ padding:16px 14px 24px; }
    .top{ flex-direction:column; }
    .secondary-controls{ width:100%; }
    .ctrl-btn{ flex:1 1 auto; justify-content:center; }
    .zoom-controls{ right:10px; bottom:10px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ============================== HEADER ============================== -->
  <header class="top">
    <div class="brand">
      <h1>Relájate <span class="accent">en la UPB</span>
        <svg class="scribble" viewBox="0 0 300 14" preserveAspectRatio="none" aria-hidden="true">
          <path d="M2 8 C 40 2, 70 13, 110 7 S 180 2, 220 8 S 270 12, 298 6"
                fill="none" stroke="var(--coral)" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </h1>
      <p>Un mapa vivo del campus para esos huecos entre clases: dónde parchar, comer algo, leer con calma o simplemente moverte un rato.</p>
    </div>

    <nav class="secondary-controls" aria-label="Controles del mapa">
      <button class="ctrl-btn" id="btn-estoy-aqui" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2.6"/><path d="M12 21c-4-4.2-7-7.9-7-11.2A7 7 0 0 1 19 9.8C19 13.1 16 16.8 12 21Z"/></svg>
        Estoy aquí
      </button>
      <button class="ctrl-btn" id="btn-que-cerca" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="2 4"/></svg>
        ¿Qué hay cerca?
      </button>
      <button class="ctrl-btn" id="btn-descubrir" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="3.4"/></svg>
        Descubrir
      </button>
    </nav>
  </header>

  <!-- ============================== FILTROS ============================== -->
  <div class="filters-wrap">
    <span class="filters-label">Explora por</span>
    <div class="filters" id="filters" role="group" aria-label="Filtros de espacios"></div>
  </div>

  <!-- ============================== MAPA ============================== -->
  <section class="map-section">
    <div class="map-frame">

/* ---------------------------- estado ---------------------------- */
const state = {
  activeFilters:new Set(),
  estoyAqui:false,
  queCerca:false,

  panning:false, lastX:0, lastY:0,

};
const YOU_POS = { x:44, y:44 }; // ubicación demo de "estoy aquí"

/* ---------------------------- referencias DOM ---------------------------- */
const filtersEl = document.getElementById('filters');
const pinsLayer = document.getElementById('pinsLayer');
const world = document.getElementById('world');
const scroller = document.getElementById('scroller');
const tooltip = document.getElementById('tooltip');
const youAreHere = document.getElementById('youAreHere');
const proxLayer = document.getElementById('proxLayer');
const discoverBubble = document.getElementById('discoverBubble');
const hintToast = document.getElementById('hintToast');
const calibReadout = document.getElementById('calibReadout');

/* ---------------------------- render filtros ---------------------------- */
FILTERS.forEach(f=>{
  const btn = document.createElement('button');
  btn.className = 'chip';
  btn.type = 'button';
  btn.dataset.filter = f.id;
  btn.setAttribute('aria-pressed','false');
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[f.icon]}</svg><span>${f.label}</span>`;
  btn.addEventListener('click', ()=>{
    if(state.activeFilters.has(f.id)){ state.activeFilters.delete(f.id); btn.classList.remove('is-on'); btn.setAttribute('aria-pressed','false'); }
    else{ state.activeFilters.add(f.id); btn.classList.add('is-on'); btn.setAttribute('aria-pressed','true'); }
    applyFilters();
  });
  filtersEl.appendChild(btn);
});

/* ---------------------------- render tarjetas de Actividades ---------------------------- */
const activitiesGrid = document.getElementById('activitiesGrid');
FILTERS.forEach(f=>{
  const info = ACTIVITY_INFO[f.id];
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'activity-card';
  card.dataset.filter = f.id;
  card.innerHTML = `
    <div class="activity-card-head">
      <span class="activity-card-badge">${f.id}</span>
      <p class="activity-card-name">${info.label}</p>
    </div>
    <ul>${info.items.map(i=>`<li>${i}</li>`).join('')}</ul>
  `;
  card.addEventListener('click', ()=>{

    if(chip) chip.click();
  });
  activitiesGrid.appendChild(card);
});

/* Las tarjetas reflejan visualmente qué filtro está activo */
const _origApplyFilters = null; // marcador, se sincroniza dentro de applyFilters()

/* ---------------------------- render pines de espacios ---------------------------- */
function makePin(space){
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'pin';
  el.style.left = space.x+'%';
  el.style.top = space.y+'%';
  el.textContent = space.n;
  el.dataset.tags = space.tags.join(',');
  el.setAttribute('aria-label', space.name);
  el.addEventListener('mouseenter', ()=>showTooltip(space, el));
  el.addEventListener('focus', ()=>showTooltip(space, el));
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('blur', hideTooltip);
  el.addEventListener('click', ()=>showTooltip(space, el));
  pinsLayer.appendChild(el);
  return el;
}
SPACES.forEach(makePin);

function makeActivityPin(act){
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'activity-pin';

  el.style.top = act.y+'%';
  el.textContent = act.letter;
  el.dataset.tags = act.tags.join(',');
  el.setAttribute('aria-label', act.name);
  el.addEventListener('mouseenter', ()=>showTooltip(act, el));
  el.addEventListener('focus', ()=>showTooltip(act, el));
  el.addEventListener('mouseleave', hideTooltip);

/* ---------------------------- tooltip (nombre + qué se puede hacer ahí) ---------------------------- */
function showTooltip(space, el){
  const fallbackSide = space.x < 32 ? 'right' : (space.x > 68 ? 'left' : (space.x < 50 ? 'left' : 'right'));
  tooltip.className = `pin-tooltip tooltip-${space.tooltipSide || fallbackSide}`;
  tooltip.innerHTML = '';
  const title = document.createElement('b');
  title.textContent = space.name;
  tooltip.appendChild(title);
  if(space.tags && space.tags.length){
    const list = document.createElement('div');
    list.className = 'tooltip-tags';
    list.textContent = space.tags.map(t => ACTIVITY_INFO[t] ? ACTIVITY_INFO[t].label : t).join(' · ');
    tooltip.appendChild(list);
  }
  tooltip.style.left = el.style.left;
  tooltip.style.top = el.style.top;
  tooltip.classList.add('show');
}
function hideTooltip(){ tooltip.classList.remove('show'); }

/* ---------------------------- filtros: resaltar sin ocultar ---------------------------- */
function applyFilters(){
  const active = state.activeFilters;
  const pins = pinsLayer.querySelectorAll('.pin, .activity-pin');
  pins.forEach(p=>{
    if(active.size === 0){
      p.classList.remove('is-dimmed','is-match');
      return;
    }
    const tags = p.dataset.tags.split(',').filter(Boolean);
    const match = tags.some(t=>active.has(t));
    p.classList.toggle('is-match', match);
    p.classList.toggle('is-dimmed', !match);
  });
  activitiesGrid.querySelectorAll('.activity-card').forEach(card=>{
    card.classList.toggle('is-on', active.has(card.dataset.filter));
  });
}

/* ---------------------------- estoy aquí ---------------------------- */
const btnEstoy = document.getElementById('btn-estoy-aqui');
btnEstoy.addEventListener('click', ()=>{
  state.estoyAqui = !state.estoyAqui;
  btnEstoy.classList.toggle('is-active', state.estoyAqui);
  btnEstoy.setAttribute('aria-pressed', String(state.estoyAqui));
  youAreHere.classList.toggle('show', state.estoyAqui);
  youAreHere.style.left = YOU_POS.x+'%';
  youAreHere.style.top = YOU_POS.y+'%';
  if(!state.estoyAqui && state.queCerca){ toggleQueCerca(false); }
});

/* ---------------------------- ¿qué hay cerca? ---------------------------- */
const btnCerca = document.getElementById('btn-que-cerca');
btnCerca.addEventListener('click', ()=>{
  if(!state.estoyAqui){
    flashToast('Activa "Estoy aquí" primero para ver qué hay cerca');
    return;
  }
  toggleQueCerca(!state.queCerca);
});

function toggleQueCerca(on){
  state.queCerca = on;
  btnCerca.classList.toggle('is-active', on);
  btnCerca.setAttribute('aria-pressed', String(on));
  proxLayer.innerHTML = '';
  document.querySelectorAll('.distance-label').forEach(n=>n.remove());
  if(!on) return;

  // distancia aproximada usando la proporción real de la imagen
  const W = 2200, H = 1571;
  const withDist = SPACES.map(s=>{
    const dx = (s.x - YOU_POS.x)/100*W;
    const dy = (s.y - YOU_POS.y)/100*H;
    return { s, dist: Math.sqrt(dx*dx+dy*dy) };
  }).sort((a,b)=>a.dist-b.dist).slice(0,4);

  withDist.forEach(({s,dist})=>{
    const mins = Math.max(1, Math.round(dist/140));
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', YOU_POS.x); line.setAttribute('y1', YOU_POS.y);
    line.setAttribute('x2', s.x); line.setAttribute('y2', s.y);
    line.setAttribute('vector-effect','non-scaling-stroke');
    proxLayer.appendChild(line);
    requestAnimationFrame(()=>line.classList.add('show'));

    const midX = (YOU_POS.x + s.x)/2, midY = (YOU_POS.y + s.y)/2;
    const lbl = document.createElement('div');
    lbl.className = 'distance-label';
    lbl.style.left = midX+'%'; lbl.style.top = midY+'%';
    lbl.textContent = `${mins} min`;
    world.appendChild(lbl);
    requestAnimationFrame(()=>lbl.classList.add('show'));
  });
}

/* ---------------------------- toast ---------------------------- */
let toastTimer=null;
function flashToast(msg){
  hintToast.textContent = msg;
  hintToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>hintToast.classList.remove('show'), 2200);

/* ---------------------------- zoom & pan ---------------------------- */
const MIN_SCALE = 1, MAX_SCALE = 3.2;
function applyTransform(){
  world.style.transform = `translate(${state.tx}px,${state.ty}px) scale(${state.scale})`;
}
function clampPan(){
  const rect = scroller.getBoundingClientRect();
  const maxX = 0, minX = -(rect.width*(state.scale-1));
  const maxY = 0, minY = -(rect.height*(state.scale-1));
  state.tx = Math.min(maxX, Math.max(minX, state.tx));
  state.ty = Math.min(maxY, Math.max(minY, state.ty));
}
function zoomAt(factor, clientX, clientY){
  const rect = scroller.getBoundingClientRect();
  const px = clientX - rect.left, py = clientY - rect.top;
  const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, state.scale*factor));
  const ratio = newScale/state.scale;
  state.tx = px - (px - state.tx)*ratio;
  state.ty = py - (py - state.ty)*ratio;
  state.scale = newScale;
  clampPan();
  applyTransform();
}
document.getElementById('zoomIn').addEventListener('click', ()=>{
  const r = scroller.getBoundingClientRect();
  zoomAt(1.3, r.left+r.width/2, r.top+r.height/2);
});
document.getElementById('zoomOut').addEventListener('click', ()=>{
  const r = scroller.getBoundingClientRect();
  zoomAt(1/1.3, r.left+r.width/2, r.top+r.height/2);
});
document.getElementById('zoomReset').addEventListener('click', ()=>{
  state.scale=1; state.tx=0; state.ty=0; applyTransform();
});
scroller.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 1/1.12;
  zoomAt(factor, e.clientX, e.clientY);
}, {passive:false});

/* arrastre (mouse + touch unificado via Pointer Events) */
const activePointers = new Map();
world.addEventListener('pointerdown', e=>{
  if(e.altKey) return; // modo calibración: no iniciar arrastre
  world.setPointerCapture(e.pointerId);
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activePointers.size===1){
    state.panning = true;
    state.lastX = e.clientX; state.lastY = e.clientY;
    world.classList.add('is-panning');
  }
});
world.addEventListener('pointermove', e=>{
  if(!activePointers.has(e.pointerId)) return;
  activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

  if(activePointers.size===2){
    const pts = [...activePointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(state.pinchDist){
      const factor = dist/state.pinchDist;
      const midX = (pts[0].x+pts[1].x)/2, midY=(pts[0].y+pts[1].y)/2;
      zoomAt(factor, midX, midY);
    }
    state.pinchDist = dist;
    return;
  }
  if(state.panning){
    state.tx += e.clientX - state.lastX;
    state.ty += e.clientY - state.lastY;
    state.lastX = e.clientX; state.lastY = e.clientY;
    clampPan();
    applyTransform();
  }
});
function endPointer(e){
  activePointers.delete(e.pointerId);
  if(activePointers.size<2) state.pinchDist=0;
  if(activePointers.size===0){
    state.panning=false;
    world.classList.remove('is-panning');
  }
}
world.addEventListener('pointerup', endPointer);
world.addEventListener('pointercancel', endPointer);
world.addEventListener('pointerleave', e=>{ if(e.buttons===0) endPointer(e); });

/* ---------------------------- modo calibración (Alt + clic) ---------------------------- */
world.addEventListener('click', e=>{
  if(!e.altKey) return;
  const rect = world.getBoundingClientRect();
  const x = ((e.clientX-rect.left)/rect.width*100).toFixed(1);
  const y = ((e.clientY-rect.top)/rect.height*100).toFixed(1);
  calibReadout.textContent = `x:${x}%  y:${y}%`;
  flashToast(`Coordenada copiada al lector: x:${x}%, y:${y}%`);
});

applyFilters();
</script>
